# Configuration for the rtspimage extension.
#
# This report does not generate any HTML. It uses the WeeWX report engine to
# invoke ffmpeg and capture a still frame from each configured RTSP camera.
#
# All tunable options live in weewx.conf under [StdReport] / [[rtspimage]];
# see the project README for the full reference.

[Generators]
    generator_list = user.rtspimage.RTSPImageGenerator
