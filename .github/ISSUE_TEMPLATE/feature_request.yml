name: Feature request
description: Suggest an improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that's hard or impossible today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: >
        What would you like it to do? For a new configuration option, suggest
        the name, where it lives, and a sensible default.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds you've tried and why they fall short.

  - type: checkboxes
    id: help
    attributes:
      label: Contribution
      options:
        - label: I'm willing to open a pull request for this.
