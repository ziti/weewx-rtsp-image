# ═══════════════════════════════════════════════════════════════════════════
#  .NET 10 / C# overlay.  Replace this file for a non-.NET project.
#
#  Trigger: push a tag like v1.2.3.
#  Does:    version-checks CHANGELOG.md, builds + tests + packs, then creates
#           a GitHub Release with notes taken from the changelog.
#  Does NOT publish to NuGet — see the commented step at the end to enable it.
# ═══════════════════════════════════════════════════════════════════════════
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Derive version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Check CHANGELOG has this version
        run: |
          grep -q "^## \[${VERSION}\] - " CHANGELOG.md \
            || { echo "::error::CHANGELOG.md has no dated section for ${VERSION}"; exit 1; }

      - name: Extract release notes
        run: |
          awk -v v="$VERSION" '
            index($0, "## [" v "] ") == 1 { grab=1; next }
            grab && index($0, "## [") == 1 { exit }
            grab && substr($0, 1, 1) == "[" { exit }
            grab { print }
          ' CHANGELOG.md | sed '/^[[:space:]]*$/d' > notes.md
          echo "--- notes.md ---"; cat notes.md
          test -s notes.md || { echo "::error::no release notes found for ${VERSION}"; exit 1; }

      - name: Detect .NET project
        id: detect
        run: |
          if ls *.sln **/*.sln *.csproj **/*.csproj >/dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-dotnet@v6
        if: steps.detect.outputs.found == 'true'
        with:
          dotnet-version: "10.0.x"

      - name: Build, test, pack
        if: steps.detect.outputs.found == 'true'
        run: |
          dotnet restore
          dotnet build -c Release --no-restore -p:Version="$VERSION"
          dotnet test -c Release --no-build
          dotnet pack -c Release --no-build -p:Version="$VERSION" -o dist

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          artifacts=()
          if compgen -G "dist/*.nupkg" > /dev/null; then artifacts=(dist/*.nupkg); fi
          gh release create "${GITHUB_REF_NAME}" "${artifacts[@]}" \
            --title "v${VERSION}" \
            --notes-file notes.md

      # ── Enable NuGet publishing: add a NUGET_API_KEY secret and uncomment ──
      # - name: Push to NuGet
      #   if: steps.detect.outputs.found == 'true'
      #   run: |
      #     dotnet nuget push "dist/*.nupkg" \
      #       --api-key "${{ secrets.NUGET_API_KEY }}" \
      #       --source https://api.nuget.org/v3/index.json \
      #       --skip-duplicate
