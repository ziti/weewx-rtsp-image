name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: ruff
        run: ruff check --output-format=github .
      - name: byte-compile
        run: python -m compileall -q bin install.py

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements-dev.txt
      - name: pytest
        run: pytest -q

  integration:
    # Import the extension against a real WeeWX, no stubs.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install weewx
      - name: import check
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, "bin")
          import weewx
          import weewx.reportengine
          import user.rtspimage as r
          assert issubclass(r.RTSPImageGenerator, weewx.reportengine.ReportGenerator)
          assert isinstance(r.VERSION, str) and r.VERSION
          cmd = r.RTSPCapture("c", "rtsp://u:p@h/1", ["/tmp/o.jpg"]).build_command("/tmp/o.jpg")
          assert cmd[:1] == ["ffmpeg"] and cmd[-2:] == ["-y", "/tmp/o.jpg"]
          print("OK: weewx", weewx.__version__, "rtspimage", r.VERSION)
          PY
